schema_version: '0.3'
handoff_id: private-match-product-decision-engine-port
artifact_status: experimental
research_authority_digest: sha256:641ec5766f05fd1ec3b9825682fa4e774d2bd3faecd8bfa314194ae203704b69
registry_path: registry/pet-integration-profiles.v0.3.yaml
selection_rule:
  complete_profile_required: true
  component_only_rejected: true
  production_selection: not-selected
  unknown_profile_behavior: fail-closed
port_fields:
- field: cancellation
  public_semantic_meaning: Current-attempt cancellation semantics.
  requirement: required
  source_profile_field: privacy_and_operations.cancellation
  expected_product_port_behavior: stop profile work and enter reviewed terminal behavior
  fail_closed_rule: reject cancellation contract without cleanup
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: cleanup
  public_semantic_meaning: Process/profile transient-data destruction and bounded Evidence.
  requirement: required
  source_profile_field: privacy_and_operations.cleanup
  expected_product_port_behavior: clean process-owned resources and record normalized outcome
  fail_closed_rule: fail release gate when required cleanup fails
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: client-side-preparation
  public_semantic_meaning: Party-local normalization, commitment, and input isolation.
  requirement: required
  source_profile_field: protocol_contract.client_side_preparation/input_normalization/input_commitment_binding
  expected_product_port_behavior: prepare locally and bind contribution to committed input
  fail_closed_rule: reject missing normalization or commitment authority
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: decision-policy-binding
  public_semantic_meaning: Exact Protocol policy ID/version bound before evaluation; no use-case predicate or threshold is selected by a PET profile.
  requirement: required
  source_profile_field: decision_derivation and authoritative operation policy binding
  expected_product_port_behavior: bind the reviewed policy ID/version into contribution, callback, receipt, transcript, and adapter invocation
  fail_closed_rule: reject missing, unknown, changed, defaulted, or substituted policy authority
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: deterministic-error-categories
  public_semantic_meaning: Closed normalized failure categories and bounded PET validator codes from config/pet-profile-error-codes.v0.1.json; runtime, Schema, mutation, and generated-result vocabularies must match exactly.
  requirement: required
  source_profile_field: protocol_contract.failure_mappings
  expected_product_port_behavior: map only catalogued codes and normalized profile categories without raw vendor, secret, or local-path detail
  fail_closed_rule: reject unknown, misspelled, out-of-vocabulary, or semantically combined error codes
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: engine-profile-identifier
  public_semantic_meaning: Exact complete profile ID, version, digest, and instance identity.
  requirement: required
  source_profile_field: profile_id/profile_version/profile_digest plus runtime profile_instance_id
  expected_product_port_behavior: select only a registry complete-decision-profile and preserve exact identity
  fail_closed_rule: reject unknown, stale, component-only, or substituted identity
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: evidence-hooks
  public_semantic_meaning: Six-status Evidence projection without secret material.
  requirement: required
  source_profile_field: protocol_contract.evidence_hooks
  expected_product_port_behavior: emit only reviewed fields and detached digests
  fail_closed_rule: reject private input, identifier, element, count, result, secret, or local path
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: execution-authorization
  public_semantic_meaning: Profile registration and synthetic contract-fixture handling do not authorize candidate or production execution.
  requirement: required
  source_profile_field: execution_contract and authoritative operation execution authorization
  expected_product_port_behavior: allow contract-fixture mode only; bind any future external grant to profile ID/version/digest, instance, source revision, environment, and expiry
  fail_closed_rule: return unsupported when reviewed candidate authority is missing; production execution is unsupported
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
  - credential
  - raw execution grant
- field: metadata-leakage-descriptor
  public_semantic_meaning: Explicit Party/Coordinator/operator/network metadata visibility.
  requirement: required
  source_profile_field: privacy_and_operations.metadata_leakage
  expected_product_port_behavior: enforce public leakage boundary and retain unknowns
  fail_closed_rule: reject omitted descriptor or unexpected private content
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: operation-stage
  public_semantic_meaning: Exact lifecycle stage and canonical operation authority derived from the public State Machine and Message Registry.
  requirement: required
  source_profile_field: operation_stage_contract.operations.lifecycle_stage
  expected_product_port_behavior: bind each port invocation to exactly one reviewed operation stage and reject operation-stage substitution
  fail_closed_rule: reject unknown, missing, or mismatched operation stage
  prohibited_content:
  - private Product class name
  - private Product source path
  - fabricated future state
- field: party-local-result-visibility
  public_semantic_meaning: Party plaintext decisions remain Party-local; bilateral values are permitted only in a synthetic global-observer surface outside Protocol messages and production Product ports.
  requirement: required
  source_profile_field: operation_stage_contract.operations.party_local_only_fields
  expected_product_port_behavior: retain Party result values in Party-local stores and pass only opaque receipt, normalized status, Evidence reference, and authority bindings across Coordinator-facing ports
  fail_closed_rule: reject bilateral plaintext Party results on any presented Protocol or Product operation
  prohibited_content:
  - Party A plaintext result
  - Party B plaintext result
  - synthetic observer data
  - Coordinator plaintext result
- field: pre-post-state-contract
  public_semantic_meaning: Exact authoritative pre-phase, phase- and acknowledgment-substate-specific TR-ABORT state shape, transition set, post-phase or effect, transcript mutation, query-budget disposition, cleanup state, and operation-specific outcome.
  requirement: required
  source_profile_field: operation_stage_contract.operations.expected_pre_phases
  expected_product_port_behavior: validate the operation, every abort source phase, and each EVALUATING contribution/Party-A/Party-B acknowledgment substate against the existing State Machine and operation-stage projection before and after invocation; bind each public profile-Evidence reference to the exact session/profile/version/digest/instance/attempt authority with the v0.3 domain-separated digest; preserve existing normalized acknowledgment, common opaque-receipt, and proposed-result-presence audit references across abort without implementing a second State Machine
  fail_closed_rule: reject impossible pre-phase or phase field, boolean-collapsed or mixed acknowledgment authority, null or mismatched receipt, missing or cross-Party proposed-result presence, stale or unbound session/profile/version/digest/instance/attempt/Evidence authority, early accepted result, unrelated transition, incorrect post-phase, budget effect, transcript mutation, cleanup state, visibility, or flattened terminal outcome
  prohibited_content:
  - independent State Machine
  - generic accepted terminal outcome
  - transition not in reviewed authority
- field: protocol-exchange-steps
  public_semantic_meaning: Ordered events/messages/guards/effects mapped to the current Protocol.
  requirement: required
  source_profile_field: protocol_contract.exchange_steps and protocol binding
  expected_product_port_behavior: invoke through existing Protocol messages and transitions only
  fail_closed_rule: reject reordered, skipped, unknown, or out-of-state step
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: resource-limits
  public_semantic_meaning: Reviewed size/CPU/memory/message bounds and normalized failure.
  requirement: required
  source_profile_field: privacy_and_operations.resource_limits
  expected_product_port_behavior: apply Product policy before and during evaluation
  fail_closed_rule: reject unbounded or exceeded resource request
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: result-and-verification-receipt
  public_semantic_meaning: Symmetric Party-local result and high-entropy opaque receipt. Canonical result_acceptance_notice version 0.2 carries the evaluation-start resource-policy and execution-authorization digests inside its signed/digested payload.
  requirement: required
  source_profile_field: protocol_contract.result_symmetry/callback/opaque_receipt
  expected_product_port_behavior: verify exact profile ID/version/digest/instance, session, attempt, receipt, Evidence, resource-policy, and execution-authority bindings before accepting each local result
  fail_closed_rule: reject asymmetric, low-entropy, or mismatched receipt
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: security-trust-model
  public_semantic_meaning: Profile-specific security assumptions and trusted components.
  requirement: required
  source_profile_field: security_model and trust_model
  expected_product_port_behavior: surface the exact experimental model without promotion
  fail_closed_rule: reject omitted or unrecognized model
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: stage-field-availability
  public_semantic_meaning: Closed required, explicit NONE/null, prohibited, introduced, retained, and invalidated fields for the selected lifecycle stage.
  requirement: required
  source_profile_field: operation_stage_contract.operations.fields_required_on_input
  expected_product_port_behavior: represent unavailable future state as explicit NONE/null where specified and reject stage-inappropriate extra fields
  fail_closed_rule: reject missing prior state or fabricated commitment, attempt, receipt, verification material, or result state
  prohibited_content:
  - future-state fabrication
  - stage-inappropriate extra field
  - implicit unavailable state
- field: supported-decision-types
  public_semantic_meaning: Minimum Protocol decisions only.
  requirement: required
  source_profile_field: protocol_contract.supported_decision_outputs
  expected_product_port_behavior: accept only MATCH, NO_MATCH, or INDETERMINATE at Party-local ports
  fail_closed_rule: reject counts, rows, identifiers, or other decisions
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: timeout
  public_semantic_meaning: Authoritative Protocol evaluation deadline.
  requirement: required
  source_profile_field: privacy_and_operations.timeout
  expected_product_port_behavior: honor Protocol timer and retain consumed budget after start
  fail_closed_rule: abort on deadline or clock mismatch
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
- field: verification-material-key-attestation
  public_semantic_meaning: Profile-specific key or attestation references and responsibilities.
  requirement: required
  source_profile_field: protocol_contract.verification_material/key_or_attestation_responsibilities
  expected_product_port_behavior: resolve only reviewed references and verify before result acceptance
  fail_closed_rule: reject missing, stale, debug, or mismatched material
  prohibited_content:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext Coordinator result
  - secret material
global_prohibited_content:
- private Product class name
- private Product source path
- raw identifier
- normalized private input
- matching element
- exact intersection count
- plaintext Coordinator result
- credential
- secret material
evidence_boundary:
  allowed:
  - profile identity/digest
  - source revision digest
  - verification material digest
  - opaque receipt digest
  - normalized status/failure
  - resource and duration classes
  prohibited:
  - private input
  - raw identifier
  - matching element
  - exact count
  - plaintext result
  - secret material
  - absolute path
  status_vocabulary:
  - pass
  - fail
  - skip
  - unsupported
  - timeout
  - tool-error
limitations:
- The handoff defines public semantics, not private Product implementation structure.
- Registration and contract-fixture validation are not candidate execution permission.
- No match predicate, production adapter, authentication, cloud, or KMS selection is made.
